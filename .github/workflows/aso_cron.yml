name: ASO Intelligence Engine

on:
  schedule:
    # 6:00 AM UTC, every day
    - cron: '0 6 * * *'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab

permissions:
  contents: write   # required so the job can push data/ back to the repo

# Prevent two runs (e.g. a scheduled run + a manual one) from racing and
# pushing conflicting commits at the same time.
concurrency:
  group: aso-intelligence-engine
  cancel-in-progress: false

jobs:
  run-aso-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed for a clean rebase before push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ASO Intelligence Engine
        run: python aso_intelligence_engine.py

      - name: Commit and push updated data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "chore: daily ASO intelligence snapshot ($(date -u +'%Y-%m-%d'))"

          # Rebase onto the latest remote state in case anything else landed
          # on the branch since checkout, then push.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin HEAD:"${GITHUB_REF_NAME}"
